# Mise en ligne automatique : à chaque changement sur main (ou à la demande depuis l'onglet Actions),
# les tests passent d'abord, puis Wakil part sur Cloudflare avec les clés rangées dans GitHub.
name: Mettre en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Vérification TypeScript
        run: npm run typecheck

  deployer:
    name: Mettre en ligne sur Cloudflare
    needs: verifier
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier la connexion à Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoutez CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Mettre en ligne
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Seules les clés renseignées dans GitHub sont envoyées : on peut commencer sans celles de WhatsApp.
      - name: Envoyer les clés à Cloudflare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          file="$RUNNER_TEMP/secrets.json"
          node -e '
            const names = ["ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL", "ADMIN_PASSWORD", "WHATSAPP_TOKEN", "WHATSAPP_APP_SECRET", "WHATSAPP_VERIFY_TOKEN"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(set));
            console.log("Clés envoyées : " + (Object.keys(set).join(", ") || "aucune"));
          ' "$file"
          if [ "$(cat "$file")" != "{}" ]; then npx wrangler secret bulk "$file"; fi
          rm -f "$file"

      - name: Résumé
        run: |
          url="${{ steps.deploy.outputs.url }}"
          {
            echo "## Wakil est en ligne"
            echo ""
            echo "| | Adresse |"
            echo "|---|---|"
            echo "| Site de Wakil | $url/ |"
            echo "| Application | $url/app/ |"
            echo "| Webhook WhatsApp | $url/webhook |"
          } >> "$GITHUB_STEP_SUMMARY"
